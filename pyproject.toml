[project]
name = "sdslora-experiments"
version = "0.1.0"
description = "SDS-LoRA commonsense and math reasoning experiments"
requires-python = "==3.13.*"
dependencies = [
    "accelerate==1.10.0",
    "datasets==3.6.0",
    "jsonlines==4.0.0",
    "numpy==2.5.1",
    "peft==0.17.0",
    "protobuf==6.31.1",
    "PyYAML==6.0.2",
    "safetensors==0.6.2",
    "sentencepiece==0.2.2",
    "tokenizers==0.21.4",
    "torch==2.6.0",
    "tqdm==4.67.1",
    "transformers==4.55.0",
]

[tool.uv]
package = false
# Resolve unpinned (transitive) dependencies as of the day after the newest pin above (sentencepiece 0.2.2)
# was released, so `uv lock` gives the same versions whenever it is rerun.
exclude-newer = "2026-07-13T00:00:00Z"
